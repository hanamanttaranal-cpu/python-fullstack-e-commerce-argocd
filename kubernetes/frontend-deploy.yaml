apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: sureshb2/python-frontend-argocd
        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        env:
        - name: NODE_ENV
          value: production

        # For local testing with kubectl port-forward only
        - name: VITE_BACKEND_API_URL
          value: "http://localhost:8000"
