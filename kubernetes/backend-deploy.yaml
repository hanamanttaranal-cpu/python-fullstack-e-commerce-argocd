apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deploy
  namespace: auru
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: 542119827827.dkr.ecr.ap-south-2.amazonaws.com/backend-java:latest
        ports:
        - containerPort: 8082

        env:
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: SPRING_DATASOURCE_URL

        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: SPRING_DATASOURCE_USERNAME

        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: SPRING_DATASOURCE_PASSWORD

        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: STRIPE_API_KEY

        - name: CLOUDINARY_CLOUD_NAME
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: CLOUDINARY_CLOUD_NAME

        - name: CLOUDINARY_API_KEY
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: CLOUDINARY_API_KEY

        - name: CLOUDINARY_API_SECRET
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: CLOUDINARY_API_SECRET

        - name: SERVER_PORT
          value: "8082"
